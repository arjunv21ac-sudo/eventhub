spring.application.name=eventhub
# Hosting platforms like Render provide the port in the PORT environment variable
server.port=${PORT:8080}

# ---------- MySQL ----------
# Locally the database is created automatically on first run.
# In production set DB_URL, DB_USERNAME and DB_PASSWORD environment variables.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/eventhub_db?createDatabaseIfNotExist=true}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
# Small pool: free database plans allow only a few connections
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# ---------- JPA ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# ---------- JWT ----------
# Must be at least 32 characters. Override with JWT_SECRET in production.
app.jwt.secret=${JWT_SECRET:eventhub-dev-secret-key-change-this-in-production-2026}
app.jwt.expiration-ms=86400000

# ---------- CORS ----------
# Comma-separated list of frontend URLs allowed to call this API
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# ---------- Email ----------
# Disabled by default. To enable with Gmail, set MAIL_ENABLED=true, MAIL_USERNAME=<your gmail>
# and MAIL_PASSWORD=<a Gmail App Password, not your normal password>.
app.mail.enabled=${MAIL_ENABLED:false}
app.mail.from=${MAIL_FROM:${MAIL_USERNAME:no-reply@eventhub.local}}
app.frontend-url=${FRONTEND_URL:http://localhost:5173}
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME:}
spring.mail.password=${MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000

# ---------- Demo data ----------
app.seed.enabled=${SEED_DATA:true}
